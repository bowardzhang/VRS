name: Daily data update + notify

on:
  # Daily at 06:00 UTC. Sources publish on their own cadence (KBA monthly, RDW
  # continuously, DfT quarterly …); this checks every day and only emails when a
  # country actually advances to a new month/quarter.
  schedule:
    - cron: "0 6 * * *"
  # Manual runs: use a large "months" value (e.g. 36) for the initial backfill.
  workflow_dispatch:
    inputs:
      months:
        description: "Number of trailing months to (re)fetch"
        required: false
        default: "3"

# Needed to commit the refreshed data/site back to the repository.
permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Snapshot committed latest periods (before download)
        run: python scripts/check_updates.py --write /tmp/before-periods.json

      - name: Download latest KBA workbooks
        # Scheduled runs fetch the trailing 3 months (skipping ones already on
        # disk); manual runs can pass a larger window for a backfill.
        # --allow-missing keeps the job green when a month is not yet published.
        # FZ 10 = brands/models/powertrain, FZ 11 = body segments.
        run: |
          MONTHS="${{ github.event.inputs.months || '3' }}"
          python scripts/download_germany.py --table fz10 --last "$MONTHS" --allow-missing
          python scripts/download_germany.py --table fz11 --last "$MONTHS" --allow-missing

      - name: Download latest Netherlands (RDW) registrations
        # RDW open data (Socrata) has open internet access from the runner.
        # Re-fetch the trailing months to pick up late revisions.
        run: |
          MONTHS="${{ github.event.inputs.months || '3' }}"
          python scripts/download_netherlands.py --last "$MONTHS"

      - name: Download latest Finland (Traficom) registrations
        # Traficom / Statistics Finland PxWeb open data. A single query returns
        # the whole current year; re-run refreshes recent months.
        run: python scripts/download_finland.py

      - name: Download latest France (INSEE) + UK (DfT) registrations
        # France: INSEE BDM national monthly totals. UK: DfT VEH0160 quarterly
        # by make. Both open, no key. --allow-missing not needed (full re-fetch).
        run: |
          python scripts/download_france.py
          python scripts/download_uk.py

      - name: Download latest Spain (DGT microdata) registrations
        # DGT monthly microdata ZIPs (fixed-width). Incremental: only new months
        # are fetched + the trailing month re-fetched for revisions.
        run: python scripts/download_spain.py --refresh-last 1

      - name: Download latest Sweden (SCB) + Austria (Statistik Austria) registrations
        # Sweden: SCB PxWeb national monthly totals + fuel split. Austria:
        # Statistik Austria OGD make-level monthly cube. Both open, no key,
        # full re-fetch each run.
        run: |
          python scripts/download_sweden.py
          python scripts/download_austria.py

      # Poland (CEPIK) is intentionally not wired in: the open register exposes
      # every first-in-country registration — new sales *and* used imports,
      # which dominate the Polish market — with no clean new-only filter or
      # server-side aggregation, so it can't yield a comparable new-registration
      # series. scripts/download_poland.py is kept for reference only.

      - name: Parse raw period data
        # Rebuilds the German per-model CSV + body segments from the workbooks so
        # the update check below sees Germany's true latest month.
        run: |
          python scripts/parse_germany.py
          python scripts/parse_segments.py

      - name: Detect per-country updates
        id: detect
        run: python scripts/check_updates.py --compare /tmp/before-periods.json

      - name: Rebuild site
        run: |
          python scripts/parse_suppliers.py
          python scripts/parse_suppliers_geo.py
          python scripts/build_supplier_pages.py
          python scripts/build_countries.py
          python scripts/build_q2_report.py
          python scripts/build_site.py

      - name: Email notification (only when a country advanced)
        if: steps.detect.outputs.updated == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: bowardzhang@gmail.com
          password: ${{ secrets.GMAIL_PASSWORD }}
          from: VRS Watch <bowardzhang@gmail.com>
          to: bowardzhang@gmail.com
          subject: "VRS: ${{ steps.detect.outputs.count }} country data update(s)"
          # Same per-country table template as the on-demand report; the detect
          # step bakes the "new data published for …" note into report_html.
          html_body: ${{ steps.detect.outputs.report_html }}
          body: ${{ steps.detect.outputs.report_text }}

      - name: Commit updated data and site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): daily registration data refresh"
            git push
          fi
